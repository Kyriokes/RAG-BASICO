<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG básico: preguntar</title>
<link rel="stylesheet" href="estilos.css">
<style>
  #respuesta { white-space: pre-wrap; margin: 0; }
  #fuentes { margin: 0; padding-left: 22px; }
  #fuentes li { margin: 2px 0; overflow-wrap: anywhere; }
  #fuentes li.no-citada { color: var(--suave); }
  #fuentes a { color: var(--acento); }
  #fuentes li.no-citada a { color: var(--suave); }
  .tiempos { color: var(--suave); font-size: 0.875rem; margin: 18px 0 0; }
</style>
</head>
<body>
<main>
  <nav>
    <a href="index.html" class="actual">Preguntar</a>
    <a href="documentos.html">Documentos</a>
  </nav>

  <section id="estado" class="tarjeta" aria-live="polite"></section>

  <h1>Preguntale a los documentos</h1>
  <p class="bajada">Responde solo con lo que dicen los PDF cargados, y cita de dónde lo sacó.</p>

  <form id="formulario" class="tarjeta">
    <label for="pregunta">Pregunta</label>
    <textarea id="pregunta" maxlength="2000" required placeholder="Por ejemplo: ¿qué hay que presentar para pedir un reintegro?"></textarea>
    <div class="fila">
      <div>
        <label for="modo">Búsqueda</label>
        <select id="modo">
          <option value="hibrida">Híbrida: palabras y significado</option>
          <option value="palabras">Solo palabras</option>
          <option value="vectores">Solo significado</option>
        </select>
      </div>
      <button type="submit" id="boton">Preguntar</button>
    </div>
  </form>

  <p id="error" class="error" hidden role="alert"></p>

  <section id="resultado" class="tarjeta" hidden aria-live="polite">
    <p id="respuesta"></p>
    <div id="bloqueFuentes">
      <h2>Fuentes</h2>
      <ol id="fuentes"></ol>
    </div>
    <p id="tiempos" class="tiempos"></p>
  </section>
</main>

<script src="estado.js"></script>
<script>
  const formulario = document.getElementById('formulario');
  const pregunta = document.getElementById('pregunta');
  const modo = document.getElementById('modo');
  const boton = document.getElementById('boton');
  const resultado = document.getElementById('resultado');
  const respuesta = document.getElementById('respuesta');
  const bloqueFuentes = document.getElementById('bloqueFuentes');
  const fuentes = document.getElementById('fuentes');
  const tiempos = document.getElementById('tiempos');
  const error = document.getElementById('error');

  const nombresDeModo = {
    hibrida: 'híbrida',
    palabras: 'por palabras',
    vectores: 'por significado'
  };

  mostrarEstado(document.getElementById('estado'));

  formulario.addEventListener('submit', async function (evento) {
    evento.preventDefault();
    // El modo se guarda al preguntar: si alguien cambia el selector mientras espera, los tiempos dicen el modo que se usó.
    const modoElegido = modo.value;
    error.hidden = true;
    boton.disabled = true;
    boton.textContent = 'Buscando...';
    try {
      const pedido = await fetch('/preguntar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pregunta: pregunta.value, modo: modoElegido })
      });
      // Un error puede venir sin cuerpo: se lee como texto y después se intenta leer el JSON.
      const cuerpo = await pedido.text();
      let datos = null;
      try { datos = JSON.parse(cuerpo); } catch (e) { datos = null; }
      if (!pedido.ok) {
        // Los errores vienen como ProblemDetails: el título dice qué pasó y el detalle, qué hacer.
        const motivo = datos && [datos.title, datos.detail].filter(Boolean).join(': ');
        mostrarError(motivo || ('La API respondió ' + pedido.status + '.'));
        return;
      }
      mostrarRespuesta(datos, modoElegido);
    } catch (e) {
      mostrarError('No se pudo conectar con la API: ' + e.message);
    } finally {
      boton.disabled = false;
      boton.textContent = 'Preguntar';
    }
  });

  function mostrarRespuesta(datos, modoUsado) {
    // textContent y no innerHTML: el texto de un documento nunca se interpreta como HTML.
    respuesta.textContent = datos.texto;

    // Los números que citó el modelo, como [2], para marcar esas fuentes.
    const citadas = new Set();
    for (const cita of datos.texto.matchAll(/\[(\d+)\]/g)) {
      citadas.add(Number(cita[1]));
    }

    fuentes.replaceChildren();
    for (const fuente of datos.fuentes) {
      const item = document.createElement('li');
      item.value = fuente.numero;
      // Cada fuente es un enlace que abre el PDF en otra pestaña, con el visor del navegador.
      // Con #page=N el visor va a la página donde empieza el fragmento. Un documento cargado antes
      // de que se guardara la página no la tiene: el enlace abre el PDF desde el principio.
      const enlace = document.createElement('a');
      let direccion = '/documentos/' + fuente.documentoId + '/pdf';
      let texto = fuente.archivo;
      if (fuente.pagina) {
        direccion += '#page=' + fuente.pagina;
        if (fuente.paginaFin && fuente.paginaFin > fuente.pagina) {
          texto += ', páginas ' + fuente.pagina + ' a ' + fuente.paginaFin;
        } else {
          texto += ', página ' + fuente.pagina;
        }
      }
      enlace.href = direccion;
      enlace.target = '_blank';
      enlace.rel = 'noopener';
      enlace.textContent = texto;
      item.appendChild(enlace);
      item.appendChild(document.createTextNode(' (fragmento ' + fuente.fragmentoId + ')'));
      if (!citadas.has(fuente.numero)) {
        item.className = 'no-citada';
        item.title = 'Se le pasó al modelo, pero no la citó';
      }
      fuentes.appendChild(item);
    }
    // Con "no encontré" la API no manda fuentes, y la página no muestra el bloque:
    // cinco documentos debajo de "no encontré" confunden.
    bloqueFuentes.hidden = datos.fuentes.length === 0;

    tiempos.textContent = 'Búsqueda ' + nombresDeModo[modoUsado] + ': ' + datos.msBusqueda
      + ' ms. Modelo: ' + datos.msModelo + ' ms.';
    resultado.hidden = false;
  }

  function mostrarError(texto) {
    resultado.hidden = true;
    error.textContent = texto;
    error.hidden = false;
  }
</script>
</body>
</html>
